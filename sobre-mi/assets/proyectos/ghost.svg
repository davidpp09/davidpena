<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="t">
  <title id="t">Ilustración de Ghost Shopper: un fantasma que llama por teléfono como cliente misterioso</title>
  <defs>
    <radialGradient id="bg" cx="38%" cy="45%" r="75%">
      <stop offset="0" stop-color="#3a1a2a"/>
      <stop offset="1" stop-color="#160a11"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7fa"/>
      <stop offset="1" stop-color="#f3dbe4"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1420"/>
      <stop offset="1" stop-color="#1a0c14"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#fda4af" fill-opacity=".09"/>
    </pattern>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#dots)"/>

  <!-- brillo detrás del fantasma -->
  <ellipse cx="250" cy="210" rx="120" ry="120" fill="#be185d" opacity=".22" filter="url(#soft)"/>

  <!-- sombra en el piso -->
  <ellipse cx="250" cy="352" rx="78" ry="10" fill="#000" opacity=".35">
    <animate attributeName="rx" values="78;70;78" dur="3.2s" repeatCount="indefinite"/>
  </ellipse>

  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -8;0 0" dur="3.2s" repeatCount="indefinite"/>

    <!-- cuerpo -->
    <path d="M250 92c-58 0-96 44-96 104v120c0 6 7 9 11 5l17-15c4-3 9-3 13 0l18 15c4 3 9 3 13 0l18-15c4-3 9-3 13 0l18 15c4 3 9 3 13 0l18-15c4-3 9-3 13 0l17 15c4 4 11 1 11-5V196c0-60-38-104-96-104z" fill="url(#body)"/>

    <!-- cara -->
    <ellipse cx="222" cy="184" rx="11" ry="15" fill="#2a1420"/>
    <ellipse cx="270" cy="184" rx="11" ry="15" fill="#2a1420"/>
    <circle cx="225" cy="178" r="3.5" fill="#fff"/>
    <circle cx="273" cy="178" r="3.5" fill="#fff"/>
    <ellipse cx="204" cy="212" rx="12" ry="7" fill="#fb7185" opacity=".45"/>
    <ellipse cx="290" cy="212" rx="12" ry="7" fill="#fb7185" opacity=".45"/>
    <path d="M236 214c6 7 14 7 20 0" stroke="#2a1420" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- brazo que sostiene el teléfono -->
    <path d="M318 262c14 2 24-4 30-14" stroke="#ecccd8" stroke-width="22" stroke-linecap="round" fill="none"/>

    <!-- teléfono -->
    <g transform="rotate(14 372 196)">
      <rect x="340" y="120" width="66" height="128" rx="13" fill="#0f070b"/>
      <rect x="345" y="126" width="56" height="116" rx="9" fill="url(#screen)"/>
      <rect x="363" y="130" width="20" height="4" rx="2" fill="#0f070b"/>
      <!-- pantalla de llamada -->
      <circle cx="373" cy="160" r="11" fill="#fda4af" opacity=".9"/>
      <path d="M368 158a5 5 0 0 1 10 0v2a5 5 0 0 1-10 0z" fill="#2a1420"/>
      <rect x="356" y="178" width="34" height="4" rx="2" fill="#f3e7ec" opacity=".8"/>
      <rect x="362" y="186" width="22" height="3" rx="1.5" fill="#b8a2ab" opacity=".7"/>
      <g fill="#fda4af">
        <rect x="355" y="204" width="3" height="10" rx="1.5"><animate attributeName="height" values="10;18;6;10" dur="1s" repeatCount="indefinite"/></rect>
        <rect x="361" y="200" width="3" height="18" rx="1.5"><animate attributeName="height" values="18;8;14;18" dur="1s" repeatCount="indefinite"/></rect>
        <rect x="367" y="203" width="3" height="12" rx="1.5"><animate attributeName="height" values="12;20;10;12" dur="1s" repeatCount="indefinite"/></rect>
        <rect x="373" y="198" width="3" height="22" rx="1.5"><animate attributeName="height" values="22;12;18;22" dur="1s" repeatCount="indefinite"/></rect>
        <rect x="379" y="203" width="3" height="12" rx="1.5"><animate attributeName="height" values="12;6;16;12" dur="1s" repeatCount="indefinite"/></rect>
        <rect x="385" y="201" width="3" height="16" rx="1.5"><animate attributeName="height" values="16;20;8;16" dur="1s" repeatCount="indefinite"/></rect>
      </g>
      <circle cx="373" cy="230" r="7" fill="#e11d48"/>
      <!-- mano -->
      <ellipse cx="346" cy="238" rx="13" ry="12" fill="#fff7fa" stroke="#ecccd8" stroke-width="2"/>
    </g>

    <!-- ondas de voz -->
    <g fill="none" stroke="#fda4af" stroke-linecap="round" stroke-width="4">
      <path d="M428 150a40 40 0 0 1 0 56" opacity=".85"/>
      <path d="M446 134a64 64 0 0 1 0 88" opacity=".5"/>
      <path d="M464 118a88 88 0 0 1 0 120" opacity=".25"/>
    </g>
  </g>

  <!-- burbujas de conversación -->
  <g font-family="Inter, system-ui, sans-serif">
    <g transform="translate(418 64)">
      <rect width="196" height="44" rx="14" fill="#f3e7ec"/>
      <path d="M18 44l-4 12 16-12z" fill="#f3e7ec"/>
      <text x="14" y="27" font-size="14" font-weight="600" fill="#2a1420">Hola, ¿sigue disponible?</text>
    </g>
    <g transform="translate(486 270)">
      <rect width="122" height="40" rx="14" fill="#3d212e" stroke="#fda4af" stroke-opacity=".35"/>
      <text x="14" y="25" font-size="13" font-weight="600" fill="#f3e7ec">Sin respuesta</text>
      <circle cx="106" cy="20" r="5" fill="#e11d48"/>
    </g>
  </g>
</svg>
